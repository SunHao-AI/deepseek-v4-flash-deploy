# qwen3-llama.yaml —— Qwen3.8-27B（GGUF，llama.cpp 引擎）
# name：CLI 标识符，`modelctl start qwen3-llama` 使用；全局唯一
name: qwen3-llama
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang）
engine: llamacpp
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8000
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

llamacpp:
  # 本地 GGUF 模型路径。为空/不存在时通过 download 段自动下载；
  # 下载成功后此字段会被覆盖为本地绝对路径（原文件备份 .yaml.bak）
  model: ""
  # download：模型不存在时的自动下载配置（ModelScope）
  download:
    # modelscope_id：ModelScope 仓库 ID（GGUF 格式，Qwen3.8-27B 量化版）
    modelscope_id: unsloth/Qwen3.8-27B-GGUF
    # quant：仓库内实际量化名（需与 GGUF 文件名量化段一致）。
    # 可选：Q3_K_M / Q4_K_M / Q5_K_M / Q6_K / Q8_0 / UD-Q4_K_XL / UD-Q5_K_XL / UD-Q8_K_XL 等
    # 显存建议：2×24GB 显卡选 Q4_K_M（约 17GB）；显存充足可选 Q5_K_M / Q8_0
    quant: Q4_K_M
  # parallel：并发槽位数（同时处理多少请求），显存占用随其增长
  parallel: 2
  # ctx_size：上下文长度；留空 = parallel × 1,048,576（1M）
  ctx_size: 32768
  # reasoning：是否输出推理过程内容（on/off）
  reasoning: on
  # reasoning_format：推理内容格式（deepseek / none 等）
  reasoning_format: deepseek
  # dspark：DSpark 投机解码开关。Qwen 无 dspark 草稿，必须 off
  dspark: off
  # cache_type_k / cache_type_v：KV cache 量化类型，降低显存占用（q8_0/f16 等）
  cache_type_k: q8_0
  cache_type_v: q8_0
  # gpu_count：实际参与推理的 GPU 数量，决定 --tensor-split 分片
  gpu_count: 2
  # fit：llama.cpp 显存适配策略（on/off）
  fit: off

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 0.5
  # price_out：每千输出 token 计价（元）
  price_out: 1.0
