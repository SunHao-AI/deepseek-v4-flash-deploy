# deepseek-v4.yaml —— DeepSeek-V4-Flash-0731（官方 llama.cpp + DSpark 投机解码）
# name：CLI 标识符，`modelctl start deepseek-v4` 使用；全局唯一
name: deepseek-v4
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang）
engine: llamacpp
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 18888
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

llamacpp:
  # 本地 GGUF 模型路径（首个分片）。若为空或文件不存在，则通过下方 download 段自动下载；
  # 下载成功后该字段会被自动覆盖为本地绝对路径（原文件备份为 .yaml.bak）
  model: /raid5/sh/model/model-gguf/DeepSeek-V4-Flash-0731-GGUF/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf
  # draft：DSpark 草稿模型路径；留空自动在模型同目录发现 dspark*.gguf
  draft: ""
  # parallel：并发槽位数（同时处理多少请求），显存占用随其增长
  parallel: 2
  # ctx_size：上下文长度；留空 = parallel × 1,048,576（1M）
  ctx_size: ""
  # reasoning：是否输出推理过程内容（on/off）
  reasoning: on
  # reasoning_format：推理内容格式（deepseek / none 等）
  reasoning_format: deepseek
  # dspark：DSpark 投机解码开关（on/off），仅 DeepSeek 系列模型可用
  dspark: on
  # spec_type：投机解码类型（draft-dspark 等）
  spec_type: draft-dspark
  # spec_draft_n_max：每次投机最多预测的 token 数
  spec_draft_n_max: 3
  # n_gpu_layers_draft：草稿模型卸载到 GPU 的层数（999 = 全部）
  n_gpu_layers_draft: 999
  # cache_type_k / cache_type_v：KV cache 量化类型，降低显存占用（q8_0/f16 等）
  cache_type_k: q8_0
  cache_type_v: q8_0
  # gpu_count：实际参与推理的 GPU 数量，决定 --tensor-split 分片
  gpu_count: 8
  # fit：llama.cpp 显存适配策略（on/off）
  fit: off
  # download：模型不存在时的自动下载配置（ModelScope）
  download:
    # modelscope_id：ModelScope 仓库 ID（GGUF 格式）
    modelscope_id: unsloth/DeepSeek-V4-Flash-0731-GGUF
    # quant：仓库内实际量化名（与 GGUF 文件名中的量化段一致）
    quant: UD-Q8_K_XL

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
