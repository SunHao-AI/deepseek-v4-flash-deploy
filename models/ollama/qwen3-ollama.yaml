# qwen3-ollama.yaml —— Qwen3-32B（ollama 引擎，子目录示例）
# name：CLI 标识符；注意：与根目录 qwen3-ollama 同名时根目录优先（向后兼容），本文件会被忽略
name: qwen3-ollama
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang）
engine: ollama
# port：服务监听端口（ollama serve 常驻端口）
port: 11434

ollama:
  # model：ollama 模型名（<name>:<tag>），不存在时 pre_start 自动 `ollama pull`
  model: qwen3:32b
  # keep_alive：模型驻留内存时长（秒）；-1 = 永久驻留，0 = 用完即卸载
  keep_alive: -1
  # num_parallel：并发请求数（OLLAMA_NUM_PARALLEL）
  num_parallel: 2
  # context_length：上下文长度（OLLAMA_CONTEXT_LENGTH）
  context_length: 32768
